<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | YashTech</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 18px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #666;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Admin Login 🔐</h1>

    <p class="subtitle">
        YashTech Administration
    </p>

    <form id="adminLoginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Admin password"
            required
        >

        <button type="submit">
            Login as Admin
        </button>

    </form>

    <div id="message"></div>

    <a href="/" class="back">
        ← Back to Website
    </a>

</div>


<script>

document
.getElementById("adminLoginForm")
.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");

    message.style.color = "#555";
    message.textContent = "Logging in...";

    try {

        const response = await fetch(
            "/api/admin/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (data.success) {

            message.style.color = "green";
            message.textContent = "Login successful!";

            setTimeout(() => {
                window.location.href =
                    "admin-dashboard.html";
            }, 700);

        } else {

            message.style.color = "red";
            message.textContent = data.message;

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";
        message.textContent =
            "Unable to connect to server.";

    }

});

</script>

</body>
</html>
