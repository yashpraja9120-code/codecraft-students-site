<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | YashTech</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);

            padding: 20px;
        }

        .container {

            width: 100%;
            max-width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 9px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        #message {

            margin-top: 15px;

            text-align: center;

            font-size: 14px;
        }

        .login {

            text-align: center;

            margin-top: 22px;

            color: #666;
        }

        .login a {

            color: #667eea;

            text-decoration: none;

            font-weight: bold;
        }

        .home {

            display: block;

            text-align: center;

            margin-top: 15px;

            color: #777;

            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Create Account 🚀</h1>

    <p class="subtitle">
        Join YashTech and start learning
    </p>

    <form id="signupForm">

        <div class="form-group">

            <label>Full Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                required
            >

        </div>


        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirm_password"
                placeholder="Confirm your password"
                required
            >

        </div>


        <button type="submit">
            Create Account
        </button>

    </form>


    <div id="message"></div>


    <div class="login">

        Already have an account?

        <a href="login.html">
            Sign In
        </a>

    </div>


    <a href="/" class="home">
        ← Back to Home
    </a>

</div>


<script>

document.getElementById("signupForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirm_password =
        document.getElementById("confirm_password").value;

    const message =
        document.getElementById("message");


    if (password !== confirm_password) {

        message.style.color = "red";

        message.textContent =
            "Passwords do not match.";

        return;
    }


    message.style.color = "#555";

    message.textContent =
        "Creating account...";


    try {

        const response = await fetch("/api/signup", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            credentials: "include",

            body: JSON.stringify({

                name: name,

                email: email,

                password: password,

                confirm_password: confirm_password

            })

        });


        const data =
            await response.json();


        if (data.success) {

            message.style.color = "green";

            message.textContent =
                "Account created successfully!";

            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1000);

        } else {

            message.style.color = "red";

            message.textContent =
                data.message;

        }

    } catch (error) {

        console.error(error);

        message.style.color = "red";

        message.textContent =
            "Unable to connect to server.";

    }

});

</script>

</body>
</html>
