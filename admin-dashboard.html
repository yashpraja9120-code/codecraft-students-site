<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | YashTech</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        .navbar {
            background: #111827;
            color: white;
            padding: 18px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .container {
            max-width: 1200px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .heading {
            margin-bottom: 25px;
        }

        .heading h1 {
            margin-bottom: 7px;
        }

        .heading p {
            color: #777;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;

            border-radius: 14px;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 14px;

            box-shadow: 0 4px 15px rgba(0,0,0,.07);

            margin-bottom: 25px;
        }

        .section h2 {
            margin-bottom: 20px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 13px;

            text-align: left;

            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8fafc;
        }

        .message {
            color: #666;
            padding: 15px 0;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        YashTech Admin
    </div>

    <button
        class="logout"
        onclick="logout()">
        Logout
    </button>

</nav>


<div class="container">

    <div class="heading">

        <h1>
            Admin Dashboard 🔐
        </h1>

        <p>
            Manage your students, visitors and feedback.
        </p>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat-card">

            <h3>
                Total Students
            </h3>

            <div
                class="number"
                id="totalStudents">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Total Visitors
            </h3>

            <div
                class="number"
                id="totalVisitors">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Today's Visitors
            </h3>

            <div
                class="number"
                id="todayVisitors">
                0
            </div>

        </div>


        <div class="stat-card">

            <h3>
                Total Feedback
            </h3>

            <div
                class="number"
                id="totalFeedback">
                0
            </div>

        </div>

    </div>


    <!-- STUDENTS -->

    <div class="section">

        <h2>
            Registered Students 👨‍🎓
        </h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Created</th>

                    </tr>

                </thead>

                <tbody id="studentsTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- FEEDBACK -->

    <div class="section">

        <h2>
            User Feedback 💬
        </h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Email</th>
                        <th>Feedback</th>
                        <th>Date</th>

                    </tr>

                </thead>

                <tbody id="feedbackTable">

                </tbody>

            </table>

        </div>

    </div>


    <!-- VISITORS -->

    <div class="section">

        <h2>
            Recent Website Visits 🌐
        </h2>

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>Visitor</th>
                        <th>Page</th>
                        <th>Date & Time</th>

                    </tr>

                </thead>

                <tbody id="visitsTable">

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

async function loadStats() {

    try {

        const response =
            await fetch("/api/stats");

        const data =
            await response.json();

        if (data.success) {

            document.getElementById(
                "totalStudents"
            ).textContent =
                data.total_students;

            document.getElementById(
                "totalVisitors"
            ).textContent =
                data.total_visitors;

            document.getElementById(
                "todayVisitors"
            ).textContent =
                data.today_visitors;

            document.getElementById(
                "totalFeedback"
            ).textContent =
                data.total_feedback;
        }

    } catch (error) {

        console.error(error);

    }

}


async function loadAdminData() {

    try {

        const response =
            await fetch(
                "/api/admin/dashboard",
                {
                    credentials: "include"
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            window.location.href =
                "admin-login.html";

            return;
        }


        // STUDENTS

        const studentsTable =
            document.getElementById(
                "studentsTable"
            );

        studentsTable.innerHTML = "";


        data.students.forEach(student => {

            studentsTable.innerHTML += `

                <tr>

                    <td>
                        ${student.id}
                    </td>

                    <td>
                        ${student.name}
                    </td>

                    <td>
                        ${student.email}
                    </td>

                    <td>
                        ${student.created_at}
                    </td>

                </tr>

            `;

        });


        // FEEDBACK

        const feedbackTable =
            document.getElementById(
                "feedbackTable"
            );

        feedbackTable.innerHTML = "";


        if (data.feedback.length === 0) {

            feedbackTable.innerHTML = `

                <tr>

                    <td colspan="4">
                        No feedback yet.
                    </td>

                </tr>

            `;

        } else {

            data.feedback.forEach(item => {

                feedbackTable.innerHTML += `

                    <tr>

                        <td>
                            ${item.name || "Guest"}
                        </td>

                        <td>
                            ${item.email || "-"}
                        </td>

                        <td>
                            ${item.message}
                        </td>

                        <td>
                            ${item.created_at}
                        </td>

                    </tr>

                `;

            });

        }


        // VISITS

        const visitsTable =
            document.getElementById(
                "visitsTable"
            );

        visitsTable.innerHTML = "";


        if (data.visits.length === 0) {

            visitsTable.innerHTML = `

                <tr>

                    <td colspan="3">
                        No visits recorded yet.
                    </td>

                </tr>

            `;

        } else {

            data.visits.forEach(visit => {

                visitsTable.innerHTML += `

                    <tr>

                        <td>
                            ${visit.visitor_id}
                        </td>

                        <td>
                            ${visit.page}
                        </td>

                        <td>
                            ${visit.visited_at}
                        </td>

                    </tr>

                `;

            });

        }

    } catch (error) {

        console.error(error);

    }

}


async function logout() {

    await fetch(
        "/api/admin/logout",
        {
            method: "POST",
            credentials: "include"
        }
    );

    window.location.href =
        "admin-login.html";

}


loadStats();

loadAdminData();

</script>

</body>
</html>
